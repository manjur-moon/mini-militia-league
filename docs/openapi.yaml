openapi: 3.1.0
info:
  title: Mini Militia League & Analytics Platform API
  version: 1.0.0-design
  description: Phase 3 API contract. Better Auth native routes are marked with x-better-auth-owned.
servers:
  - url: http://localhost:5000
    description: Local API
  - url: https://api.example.com
    description: Production placeholder
tags:
  - name: AI Summaries
  - name: Achievements
  - name: Audit Logs
  - name: Authentication
  - name: Challenges
  - name: Dashboard
  - name: Hall of Fame
  - name: Leaderboards
  - name: League Config
  - name: MVP
  - name: Matches
  - name: Notifications
  - name: OCR
  - name: Players
  - name: Ratings
  - name: Rivalries
  - name: Seasons
  - name: Security
  - name: Statistics
  - name: System
  - name: Titles
  - name: Uploads
  - name: Users
  - name: Verification
paths:
  /api/v1/health:
    get:
      tags:
        - System
      summary: Return API and database health.
      operationId: getV1Health
      description: "Access: Public


        Validation: No input.


        Security notes: Aggressive public rate limit; never expose secrets or connection strings."
      security: []
      parameters: []
      responses:
        "200":
          description: 200 — status, timestamp, environment-safe service checks.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "503":
          description: 503 SERVICE_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/security/csrf-token:
    get:
      tags:
        - Security
      summary: Issue or rotate a double-submit CSRF token.
      operationId: getV1SecurityCsrfToken
      description: "Access: Public session-aware


        Validation: Session may be absent; token must be cryptographically random.


        Security notes: Required before cookie-authenticated mutation requests when frontend and API are cross-site."
      security: []
      parameters: []
      responses:
        "200":
          description: 200 — csrfToken and expiry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: 500 INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/auth/sign-up/email:
    post:
      tags:
        - Authentication
      summary: Register with email and password.
      operationId: postAuthSignUpEmail
      description: "Access: Public


        Validation: Valid email; name 2–80; password 8–128; role and linkedPlayerId rejected from client.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth native sign-up response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 403 EMAIL_NOT_VERIFIED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: 422 USER_ALREADY_EXISTS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: name:string, email:string, password:string, callbackURL?:url
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/sign-in/email:
    post:
      tags:
        - Authentication
      summary: Create an email/password session.
      operationId: postAuthSignInEmail
      description: "Access: Public


        Validation: Valid email; password required; disabled/banned accounts rejected.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth native sign-in response plus session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_CREDENTIALS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 403 ACCOUNT_DISABLED_OR_UNVERIFIED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: email:string, password:string, rememberMe?:boolean, callbackURL?:url
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/sign-out:
    post:
      tags:
        - Authentication
      summary: End the current session.
      operationId: postAuthSignOut
      description: "Access: Authenticated


        Validation: Valid session cookie.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security:
        - cookieSession: []
      parameters: []
      responses:
        "200":
          description: Better Auth native sign-out response; clears current cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-better-auth-owned: true
  /api/auth/get-session:
    get:
      tags:
        - Authentication
      summary: Read the current Better Auth session.
      operationId: getAuthGetSession
      description: "Access: Public session-aware


        Validation: Cookie/header parsed by Better Auth.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth session object or null.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "500":
          description: 500 AUTH_PROVIDER_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-better-auth-owned: true
  /api/auth/send-verification-email:
    post:
      tags:
        - Authentication
      summary: Send or resend an email verification link.
      operationId: postAuthSendVerificationEmail
      description: "Access: Public


        Validation: Valid email; generic response prevents account enumeration.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth native response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: email:string, callbackURL?:url
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/request-password-reset:
    post:
      tags:
        - Authentication
      summary: Request a password-reset email.
      operationId: postAuthRequestPasswordReset
      description: "Access: Public


        Validation: Valid email; generic response prevents account enumeration.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth native generic success response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_REQUEST
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: email:string, redirectTo?:url
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with a valid token.
      operationId: postAuthResetPassword
      description: "Access: Public token


        Validation: Token required and unexpired; password 8–128; revoke other sessions per configuration.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security: []
      parameters: []
      responses:
        "200":
          description: Better Auth native response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_OR_EXPIRED_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: 422 WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: 429 RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: token:string, newPassword:string
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change current password.
      operationId: postAuthChangePassword
      description: "Access: Authenticated


        Validation: Fresh session may be required; password 8–128.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security:
        - cookieSession: []
      parameters: []
      responses:
        "200":
          description: Better Auth native response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_CURRENT_PASSWORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: 422 WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: currentPassword:string, newPassword:string, revokeOtherSessions?:boolean
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/revoke-session:
    post:
      tags:
        - Authentication
      summary: Revoke one of the current user’s sessions.
      operationId: postAuthRevokeSession
      description: "Access: Authenticated


        Validation: Token must belong to current user.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security:
        - cookieSession: []
      parameters: []
      responses:
        "200":
          description: Better Auth native response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "400":
          description: 400 INVALID_TOKEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: token:string
              additionalProperties: true
      x-better-auth-owned: true
  /api/auth/revoke-other-sessions:
    post:
      tags:
        - Authentication
      summary: Revoke all sessions except current.
      operationId: postAuthRevokeOtherSessions
      description: "Access: Authenticated


        Validation: Fresh session recommended.


        Security notes: Owned by Better Auth; mounted before express.json(); credentialed CORS; Better Auth trustedOrigins
        and native CSRF/origin protections."
      security:
        - cookieSession: []
      parameters: []
      responses:
        "200":
          description: Better Auth native response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BetterAuthNativeResponse"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-better-auth-owned: true
  /api/v1/me:
    get:
      tags:
        - Users
      summary: Return sanitized current-user, role and linked-player context.
      operationId: getV1Me
      description: "Access: Authenticated


        Validation: include enum; never return account password hash, session token or private adapter fields.


        Security notes: Cookie session; response field allowlist."
      security:
        - cookieSession: []
      parameters:
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: include=player,permissions
      responses:
        "200":
          description: 200 — sanitized user, session summary, permissions and optional linked player.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/users:
    get:
      tags:
        - Users
      summary: List user accounts.
      operationId: getV1Users
      description: "Access: Admin


        Validation: page>=1; limit 1–100; role enum; status active|banned; sort allowlist.


        Security notes: Admin only; email search rate-limited; no account/session secrets."
      security:
        - cookieSession: []
      parameters:
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: page, limit, search, role, status, linked, sortBy, sortOrder
      responses:
        "200":
          description: 200 — sanitized users and standard pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: 400 INVALID_QUERY
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 403 FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-pagination: true
  /api/v1/users/{userId}:
    get:
      tags:
        - Users
      summary: Get one sanitized user account.
      operationId: getV1UsersUserid
      description: "Access: Admin


        Validation: Non-empty Better Auth user ID.


        Security notes: Admin only; field allowlist."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — user, role, ban state, linked player and safe session count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "401":
          description: 401 UNAUTHENTICATED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: 403 FORBIDDEN
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 404 USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/v1/users/{userId}/role:
    patch:
      tags:
        - Users
      summary: Change a user role through guarded workflow.
      operationId: patchV1UsersUseridRole
      description: "Access: Admin


        Validation: Allowed role only; reason 5–500; cannot remove final active admin; cannot self-demote final admin.


        Security notes: CSRF token; fresh admin session; audit log; direct Better Auth set-role route not used by UI."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — updated sanitized user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: 400 VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 409 LAST_ADMIN_PROTECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 404 USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: "role: player|moderator|admin, reason:string, expectedUpdatedAt?:datetime"
              additionalProperties: true
  /api/v1/users/{userId}/status:
    patch:
      tags:
        - Users
      summary: Ban/disable or reactivate an account.
      operationId: patchV1UsersUseridStatus
      description: "Access: Admin


        Validation: Cannot ban final admin; reason required when banning; expiry 60–31536000 seconds.


        Security notes: CSRF token; fresh admin session; audit log; revoke sessions on ban."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — updated account status; sessions revoked on ban.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: 400 VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 409 LAST_ADMIN_PROTECTED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: 404 USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: status:active|banned, reason:string, banExpiresIn?:integer
              additionalProperties: true
  /api/v1/users/{userId}/player-link:
    put:
      tags:
        - Users
      summary: Link a user account to one player profile.
      operationId: putV1UsersUseridPlayerLink
      description: "Access: Admin


        Validation: Both entities exist; one-to-one uniqueness; moderator/admin may link without being players.


        Security notes: CSRF token; transaction where supported; audit and player notification."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — linked user/player summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: 404 USER_OR_PLAYER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 409 USER_ALREADY_LINKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: playerId:MM###, reason?:string
              additionalProperties: true
    delete:
      tags:
        - Users
      summary: Remove a user-player link.
      operationId: deleteV1UsersUseridPlayerLink
      description: "Access: Admin


        Validation: Existing link required; reason 5–500.


        Security notes: CSRF token; transaction where supported; audit log."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — unlinked user/player summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: 404 LINK_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: 409 STALE_WRITE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: reason:string
              additionalProperties: true
  /api/v1/users/{userId}/sessions:
    get:
      tags:
        - Users
      summary: List safe session metadata for a user.
      operationId: getV1UsersUseridSessions
      description: "Access: Admin


        Validation: page>=1; limit<=100; session tokens never returned.


        Security notes: Admin only; redact session tokens and exact cookie values."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string, page, limit
      responses:
        "200":
          description: 200 — device/session metadata and pagination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: 404 USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      x-pagination: true
    delete:
      tags:
        - Users
      summary: Revoke every session for a user.
      operationId: deleteV1UsersUseridSessions
      description: "Access: Admin


        Validation: User exists.


        Security notes: CSRF token; audit log."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string
      responses:
        "200":
          description: 200 — revokedCount.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: 404 USER_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: reason?:string
              additionalProperties: true
  /api/v1/users/{userId}/sessions/{sessionId}:
    delete:
      tags:
        - Users
      summary: Revoke one user session.
      operationId: deleteV1UsersUseridSessionsSessionid
      description: "Access: Admin


        Validation: Session must belong to user; current final-admin safeguard where relevant.


        Security notes: CSRF token; fresh admin session; audit event without token value."
      security:
        - cookieSession: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
        - name: contractParameters
          in: query
          required: false
          schema:
            type: string
          description: userId:string, sessionId:string
      responses:
        "200":
          description: 200 — revoked=true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "404":
          description: 404 SESSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      requestBody:
        required: true
        content:

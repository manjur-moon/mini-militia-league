components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Actual cookie name may be prefixed/configured by Better Auth.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  schemas:
    ApiSuccess:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          const: true
        message:
          type: string
        data: {}
        pagination:
          $ref: "#/components/schemas/Pagination"
    ApiError:
      type: object
      required:
        - success
        - message
        - errors
      properties:
        success:
          type: boolean
          const: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              field:
                type:
                  - string
                  - "null"
              message:
                type: string
        requestId:
          type:
            - string
            - "null"
    Pagination:
      type: object
      required:
        - page
        - limit
        - totalItems
        - totalPages
        - hasNextPage
        - hasPreviousPage
      properties:
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
        totalItems:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        hasNextPage:
          type: boolean
        hasPreviousPage:
          type: boolean
    BetterAuthNativeResponse:
      type: object
      additionalProperties: true
      description: Response shape is owned by the installed Better Auth version and plugins.

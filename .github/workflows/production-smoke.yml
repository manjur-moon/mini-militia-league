name: Production Smoke Test

on:
  workflow_dispatch:
    inputs:
      public_api_url:
        description: HTTPS backend origin
        required: true
        type: string
      public_app_url:
        description: HTTPS frontend origin
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Verify deployed frontend and backend
        env:
          PUBLIC_API_URL: ${{ inputs.public_api_url }}
          PUBLIC_APP_URL: ${{ inputs.public_app_url }}
        run: node scripts/deployment/verify-production.mjs
